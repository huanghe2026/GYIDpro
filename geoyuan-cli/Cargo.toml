[package]
name = "geoyuan-cli"
version = "0.1.0"
edition = "2021"
description = "GeoYuan CLI tool - generate, verify, and manage GyIDs"

[[bin]]
name = "geoyuan"
path = "src/main.rs"

[dependencies]
geoyuan-core = { path = "../geoyuan-core" }

# CLI framework
clap = { version = "4.5", features = ["derive", "color"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde_json = "1.0"

# Colors / output
colored = "2.1"

# Error handling
anyhow = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Table output
tabled = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# hex
hex = "0.4"

# File paths
dirs = "5.0"

# Random (for test generation)
rand = "0.8"
