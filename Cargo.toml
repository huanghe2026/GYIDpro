[workspace]
resolver = "2"
members = [
    "trip-core",
    "trip-cli",
    "trip-server",
    "gyid-shared",
    "gyid-wasm",
    "gyid-android-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GyID Team"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/gyid/gyid"
repository = "https://github.com/gyid/gyid"
description = "Decentralized Identity System based on multi-dimensional dynamic account generation"

[workspace.dependencies]
# 哈希算法
blake3 = "1.5"
sha2 = "0.10"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 跨平台硬件信息
sysinfo = "0.30"
# UUID（支持 WASM via js feature）
uuid = { version = "1.7", features = ["v4", "js"] }

# 网络请求（支持 native + WASM）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 异步运行时（native 平台）
tokio = { version = "1.36", features = ["full"] }

# 图片处理（支持 WASM）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# 数据库（仅 native，bundled = 自带 SQLite C 源码）
rusqlite = { version = "0.31", features = ["bundled"] }

# 编码
base58 = "0.2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"

# 目录
dirs = "5.0"

# 时间
chrono = "0.4"

# 随机数
rand = "0.8"

# hex 编码
hex = "0.4"

# 测试
tempfile = "3.10"

# SDK 依赖（gyid-sdk 使用）
async-trait = "0.1"

# 性能优化配置 (用户 8GB RAM)
[profile.dev]
opt-level = 0
debug = false
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3     # 最大速度优化
lto = "thin"     # 链接时优化（加速启动）
codegen-units = 1
strip = true
panic = "abort"
