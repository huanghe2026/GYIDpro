[package]
name = "trip-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TRIP Verifier HTTP/WS server — Active Verification three-party flow"

[lib]
name = "trip_server"
path = "src/lib.rs"

[[bin]]
name = "trip-server"
path = "src/main.rs"

[dependencies]
trip-core = { path = "../trip-core", features = ["anchor"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["trace", "cors"] }
# 链上中继（GeoTITRegistry JSON-RPC）；特性与 trip-cli 保持一致。
reqwest = { workspace = true }
# Unix socket 监听（`TRIP_LISTEN=unix:...`）：axum 0.7 的 `serve` 只吃 TcpListener，
# 这一路需手动驱动 hyper 1.x；`tower` 仅为把 axum Router 当 Service 调用。
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"

[dev-dependencies]
rand = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = "0.24"
