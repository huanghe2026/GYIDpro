[package]
name = "geoyuan-core"
version = "0.1.0"
edition = "2021"
authors = ["GeoYuan Team"]
description = "GeoYuan core library - Photo-based GeoID generation and GeoCoin wallet"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hash algorithms
blake3 = "1.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"

# EXIF parsing
kamadak-exif = "0.5"
img-parts = "0.3"

# Image processing
image = "0.25"

# Base encoding
base58 = "0.2"
hex = "0.4"

# HTTP client (for AMap API on Windows)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# Database
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
redb = { version = "2.1", optional = true }

# Binary serialization
bincode = { version = "1.3", optional = true }
ciborium = { version = "0.2", optional = true }

# P2P networking
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "mdns", "kad", "request-response", "macros", "tokio", "cbor"], optional = true }

# Crypto signatures
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }

# Random number generation
rand = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Async traits
async-trait = "0.1"

# UUID for transaction IDs
uuid = { version = "1.7", features = ["v4", "serde"] }

# IPFS compatible hashing
multihash = "0.19"

# H3 hexagon grid (Res 12: ~9m edge, ~17m width)
h3o = "0.9"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"

[features]
default = ["native"]
native = ["rusqlite", "redb", "bincode", "ciborium", "reqwest", "tokio/rt-multi-thread", "libp2p", "ed25519-dalek", "tracing-subscriber"]
wasm = []  # For WASM target, skip native deps

[lib]
name = "geoyuan_core"
crate-type = ["rlib"]
