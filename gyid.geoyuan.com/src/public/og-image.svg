<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="rgba(0,240,255,0.18)"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(120,235)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#00f0ff" stroke-width="6" transform="rotate(45 60 60)" opacity="0.75"/>
    <rect x="18" y="18" width="84" height="84" fill="none" stroke="#ff2bd6" stroke-width="5" transform="rotate(12 60 60)" opacity="0.55"/>
    <text x="60" y="82" font-family="Orbitron, sans-serif" font-weight="900" font-size="74" fill="#00f0ff" text-anchor="middle">G</text>
  </g>

  <text x="300" y="300" font-family="Orbitron, sans-serif" font-weight="900" font-size="84" fill="#e6f1f5" letter-spacing="4">GEOYUAN</text>
  <text x="302" y="350" font-family="'Share Tech Mono', monospace" font-size="26" fill="#7e8a99" letter-spacing="6">geo · identity · web3</text>
  <text x="302" y="420" font-family="'Share Tech Mono', monospace" font-size="30" fill="#00f0ff">Decentralized Identity for the Physical World</text>
</svg>
