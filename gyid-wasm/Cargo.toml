[package]
name = "gyid-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WASM bridge for gyid-shared (browser SPA), exposes Ed25519 identity, breadcrumb, chain, liveness, and PoH APIs to JS with tsify auto-generated .d.ts"

[lib]
name = "gyid_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
gyid-shared = { path = "../gyid-shared", features = ["encrypt"] }
trip-core = { path = "../trip-core" }

# WASM FFI + 类型桥
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", default-features = false, features = ["js"] }

# hex 编码
hex = "0.4"

# H3 量化（h3o 0.7 纯 Rust，WASM 友好）
h3o = "0.7"

# rand_core → getrandom；浏览器环境 MUST 启用 js feature
# （trip-core 的 rand_core 0.6 也带 getrandom，这里显式 pin 0.2 js 覆盖）
getrandom = { version = "0.2", features = ["js"] }

# panic → console.error（调试体验）
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
