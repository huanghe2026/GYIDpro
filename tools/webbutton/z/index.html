<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYID 生成器 - GEOYUAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gyid-webbutton.css">
</head>
<body>
  <!-- GEOYUAN 弹窗挂载点 -->
  <div id="gyid-widget-root"></div>

  <!-- 页面内容 (示例) -->
  <div class="demo-content">
    <h1>GEOYUAN GYID WebButton 演示</h1>
    <p>点击右下角的 GEOYUAN 按钮体验 GYID 生成器</p>
  </div>

  <!-- 依赖脚本 -->
  <script src="js/qrcode.min.js"></script>

  <!-- 主脚本 -->
  <script src="js/gyid-webbutton.js"></script>
  <script>
    // 初始化 GYID WebButton
    document.addEventListener('DOMContentLoaded', () => {
      GyIDWebButton.init({
        position: 'bottom-right',
        locale: 'zh-CN',
        features: {
          fingerprint: true,
          geo: true,
          avatar: true,
          chain: true,
          qrExport: true
        },
        onGyIdGenerated: (result) => {
          console.log('GYID 生成成功:', result.gyid);
        }
      });
    });
  </script>
</body>
</html>
